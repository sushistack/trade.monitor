# Coin configurations (Binance)
coins:
  - symbol: "BTCUSDT"
    display_name: "BTC"
    upload_host: "crypto-btc"
  - symbol: "ETHUSDT"
    display_name: "ETH"
    upload_host: "crypto-eth"
  - symbol: "XRPUSDT"
    display_name: "XRP"
    upload_host: "crypto-xrp"
  - symbol: "SOLUSDT"
    display_name: "SOL"
    upload_host: "crypto-sol"
  - symbol: "DOGEUSDT"
    display_name: "DOGE"
    upload_host: "crypto-doge"

# Stock/index configurations (Yahoo Finance)
stocks:
  - symbol: "^GSPC"
    display_name: "SP500"
    upload_host: "stock-snp500"

# Chart settings
chart:
  width: 240
  height: 240
  style: "tradingview"
  jpeg_quality: 85

# Upload settings
upload:
  timeout: 30.0
  retries: 3
  dir: "/image/"

# Timeframes to generate
# 1D = Last 24 hours (hourly candles)
# 1M = Last 30 days (daily candles)
timeframes:
  - code: "1D"
    interval: "1h"
    limit: 24
  - code: "1M"
    interval: "1d"
    limit: 30

# Logging
logging:
  level: "INFO"
  file: "logs/trade_monitor.log"

# AWTRIX3 settings (ulanzi)
awtrix:
  enabled: true
  host: "ulanzi"
  app_name: "nasdaq"
  icon: "47"
  color: [0, 200, 100]
  ticker: "^IXIC"
