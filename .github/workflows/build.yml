# Story 5.6 (home-server-gitops) — build trade-monitor and publish to GHCR. The home-server-gitops
# CronJob consumes the published image (digest-pinned at hardening; tag `0.1.0` until then).
#
# Publishes ghcr.io/sushistack/trade.monitor with three refs per push to master:
#   :0.1.0      — the stable tag the gitops manifest pins (bump on a real release)
#   :sha-<sha>  — immutable per-commit tag
#   @sha256:... — the digest (printed in the job summary; swap the manifest to this at hardening, AR29)
#
# After the FIRST successful run, mark the GHCR package PUBLIC (Settings → Package → Change
# visibility) so the trade-monitor namespace needs NO imagePullSecret. Until then the pod can't pull.
name: build

on:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "config/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}   # -> ghcr.io/sushistack/trade.monitor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:0.1.0
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report digest (pin this in home-server-gitops, AR29)
        run: |
          echo "### trade-monitor image" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin in home-server-gitops \`workloads/trade-monitor/cronjob.yaml\` + \`versions.yaml\`:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
